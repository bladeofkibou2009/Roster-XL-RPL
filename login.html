<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login Buku</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: linear-gradient(135deg, #0f172a, #1d4ed8);
      font-family: Arial, sans-serif;
    }

    .login-box {
      width: 360px;
      background: rgba(255, 255, 255, 0.95);
      padding: 30px 25px;
      border-radius: 16px;
      box-shadow: 0 15px 30px rgba(0, 0, 0, 0.2);
    }

    h2 {
      text-align: center;
      margin-bottom: 25px;
      color: #1e3a8a;
    }

    label {
      display: block;
      margin-bottom: 8px;
      font-weight: bold;
      color: #374151;
    }

    input {
      width: 100%;
      padding: 10px 12px;
      margin-bottom: 18px;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      box-sizing: border-box;
      font-size: 16px;
    }

    button {
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: 8px;
      background: #2563eb;
      color: white;
      font-weight: bold;
      font-size: 16px;
      cursor: pointer;
    }

    button:hover {
      background: #1d4ed8;
    }

    .kembali {
      margin-top: 15px;
      text-align: center;
    }

    .kembali a {
      color: #2563eb;
      text-decoration: none;
      font-weight: bold;
    }

    .error-message {
      display: none;
      margin-top: 12px;
      padding: 10px;
      border-radius: 8px;
      background: #fee2e2;
      color: #b91c1c;
      font-size: 14px;
      text-align: center;
    }
  </style>
</head>
<body>
  <div class="login-box">
    <h2>Login Buku</h2>
    <form id="loginForm">
      <label for="gerald">Username</label>
      <input type="text" id="username" name="username" placeholder="Masukkan username" required>

      <label for="gerald">Password</label>
      <input type="password" id="password" name="password" placeholder="Masukkan password" required>

      <button type="submit">Masuk</button>
      <div id="errorMessage" class="error-message">Username atau password salah!</div>
    </form>

    <div class="kembali">
      <a href="index.html">Kembali</a>
    </div>
  </div>

  <script>
    const loginForm = document.getElementById('loginForm');
    const errorMessage = document.getElementById('errorMessage');

    loginForm.addEventListener('submit', function (event) {
      event.preventDefault();

      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value.trim();

      if (username === 'nysa' && password === 'nysa') {
        window.location.href = 'buku.html';
      } else {
        errorMessage.style.display = 'block';
      }
    });
  </script>
</body>
</html>
